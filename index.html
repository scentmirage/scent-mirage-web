    // ==========================================
    // 4. 模組 2：氣味潛意識測驗
    // ==========================================
    function QuizView({ onCompleteQuiz, onBackHome }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [selectedIndex, setSelectedIndex] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      const q = QUIZ_QUESTIONS[currentQ];

      const handleSelectOption = (index, targetId) => {
        if (selectedIndex !== null) return;
        setSelectedIndex(index);

        const nextAnswers = [...answers, targetId];
        setAnswers(nextAnswers);

        setTimeout(() => {
          if (currentQ < QUIZ_QUESTIONS.length - 1) {
            setCurrentQ(prev => prev + 1);
            setSelectedIndex(null);
          } else {
            setIsLoading(true);
            setTimeout(() => {
              const finalId = calculateScoring(nextAnswers);
              onCompleteQuiz(finalId);
            }, 1500);
          }
        }, 500);
      };

      const calculateScoring = (ansArr) => {
        const counts = {};
        ansArr.forEach(id => { counts[id] = (counts[id] || 0) + 1; });

        let maxCount = 0;
        let modeId = null;
        let tie = false;

        for (const id in counts) {
          if (counts[id] > maxCount) {
            maxCount = counts[id];
            modeId = Number(id);
            tie = false;
          } else if (counts[id] === maxCount) {
            tie = true;
          }
        }

        if (maxCount === 1 || tie) {
          return ansArr[2];
        }
        return modeId;
      };

      if (isLoading) {
        return (
          <div className="bg-paperCard rounded-3xl p-12 shadow-salon border border-line text-center animate-fade-in flex flex-col items-center justify-center min-h-[380px]">

            <p className="text-xs text-subtle font-light">沉澱呼吸，感官即將顯影</p>
          </div>
        );
      }

      return (
        <section key={currentQ} className="bg-paperCard rounded-3xl p-7 md:p-9 shadow-salon border border-line animate-fade-in relative">
          <div className="mb-6">
            <div className="flex justify-between items-center text-xs text-subtle mb-2.5">

                className="text-[11px] text-muted hover:text-ink underline transition font-light cursor-pointer"

            <div className="w-full bg-sand h-1.5 rounded-full overflow-hidden">
              <div 
                className="bg-amberAccent h-full transition-all duration-300 ease-out rounded-full" 
                style={{ width: `${((currentQ + 1) / 3) * 100}%` }}
              ></div>
            </div>
          </div>

          <h3 className="font-serif text-xl md:text-2xl text-ink font-normal mb-1.5 leading-snug">
            {q.question}
          </h3>
          <p className="text-xs text-subtle font-light mb-6">
            {q.subtitle}
          </p>

          <div className="space-y-3">
            {q.options.map((opt, idx) => {
              const isSelected = selectedIndex === idx;
              return (
                <div
                  key={idx}
                  onClick={() => handleSelectOption(idx, opt.targetId)}
                  className={`p-4 rounded-2xl border text-left cursor-pointer transition-all duration-200 flex items-center justify-between ${
                    isSelected
                      ? 'border-amberAccent bg-amberLight shadow-sm scale-[1.01]'
                      : 'border-line bg-paper/50 hover:bg-paper hover:border-muted/50'
                  }`}
                >
                  <span className={`text-xs md:text-sm leading-relaxed ${isSelected ? 'text-ink font-medium' : 'text-ink/90'}`}>
                    {opt.text}
                  </span>
                  <div className={`w-5 h-5 rounded-full flex items-center justify-center border text-xs ml-3 shrink-0 ${
                    isSelected ? 'border-amberAccent bg-amberAccent text-white' : 'border-line bg-white'
                  }`}>
                    {isSelected ? '✓' : ''}
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // ==========================================

    function CardDrawView({ onCardSelected, onBackHome }) {
      const [shuffledCards, setShuffledCards] = useState([]);
      const [flippedIndex, setFlippedIndex] = useState(null);

    // ==========================================
    // 9. 會員 Modal 彈窗組件
    // ==========================================
    function MemberModal({ isOpen, onClose, session, profile, onProfileChanged }) {
      const [mode, setMode] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [name, setName] = useState("");
      const [message, setMessage] = useState("");
      const [busy, setBusy] = useState(false);
      const [profileName, setProfileName] = useState("");

      useEffect(() => {
        if (isOpen && window.location.hash.includes("type=recovery")) setMode("recover");
      }, [isOpen]);

      useEffect(() => {
        if (profile?.display_name) setProfileName(profile.display_name);
      }, [profile]);

      const submit = async (event) => {
        event.preventDefault();
        setMessage("");
        if (!supabaseClient) {
          setMessage("會員登入尚未完成資料庫設定，請先設定 Supabase 專案網址、公開 anon key 及資料表。");
          return;
        }
        setBusy(true);
        try {
          if (mode === "register") {
            const { data, error } = await supabaseClient.auth.signUp({ email: email.trim(), password, options: { data: { display_name: name.trim() }, emailRedirectTo: window.location.origin } });
            if (error) throw error;
            setMessage(data.session ? "會員帳戶已建立。" : "確認電郵已寄出，請完成驗證後再登入。");
          } else if (mode === "login") {
            const { error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
            if (error) throw error;
            setMessage("登入成功。");
          } else if (mode === "reset") {
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin });
            if (error) throw error;
            setMessage("如該電郵已註冊，系統會寄出重設密碼連結。");
          } else if (mode === "recover") {
            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) throw error;
            setPassword("");
            setMode("login");
            setMessage("密碼已更新，請重新登入。");
            await supabaseClient.auth.signOut();
          }
        } catch (error) {
          setMessage(error?.message || "操作未能完成，請稍後再試。");
        } finally {
          setBusy(false);
        }
      };

      const saveProfile = async (event) => {
        event.preventDefault();
        if (!supabaseClient || !session?.user?.id) return;
        setBusy(true);
        setMessage("");
        const { error } = await supabaseClient.from("member_profiles").update({ display_name: profileName.trim(), updated_at: new Date().toISOString() }).eq("id", session.user.id);
        setBusy(false);
        if (error) setMessage(error.message);
        else {
          setMessage("會員資料已更新。");
          onProfileChanged();
        }
      };

      if (!isOpen) return null;
      const lastScent = profile?.last_scent_id ? PRESCRIPTIONS.find((item) => item.id === Number(profile.last_scent_id)) : null;

      return (
        <div className="fixed inset-0 bg-ink/45 backdrop-blur-sm flex items-center justify-center p-4 z-50" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose(); }}>
          <div role="dialog" aria-modal="true" aria-labelledby="member-title" className="bg-paperCard rounded-3xl p-6 md:p-8 max-w-md w-full max-h-[90vh] overflow-y-auto shadow-float border border-line animate-fade-in">
            <div className="flex justify-between items-start gap-4 mb-5">
              <div>
                <span className="font-cormorant text-xs tracking-[0.3em] uppercase text-amberAccent">SCENT MIRAGE MEMBERS</span>
                <h3 id="member-title" className="font-serif text-xl text-ink mt-1">會員帳戶</h3>
              </div>
              <button onClick={onClose} aria-label="關閉" className="text-subtle hover:text-ink text-xl">×</button>
            </div>
            {!supabaseClient ? (
              <div className="rounded-2xl bg-sand/60 border border-line p-5">
                <p className="text-sm text-ink font-medium">會員功能待啟用</p>
                <p className="text-xs text-muted leading-relaxed mt-2">此版本已備妥註冊、登入、電郵驗證、重設密碼及香氣結果儲存流程。正式啟用前，管理者需連結 Supabase 並套用會員資料庫設定。</p>
              </div>
            ) : session && mode !== "recover" ? (
              <div>
                <p className="text-xs text-muted leading-relaxed">已登入：{session.user.email}</p>
                <form onSubmit={saveProfile} className="space-y-4 mt-5">
                  <label className="block text-xs text-muted">顯示名稱<input value={profileName} onChange={(event) => setProfileName(event.target.value)} required className="mt-1 w-full rounded-xl border border-line bg-paper px-3 py-3 text-sm text-ink outline-none focus:border-amberAccent" /></label>
                  <button disabled={busy} className="w-full rounded-xl bg-ink px-4 py-3 text-xs text-paper disabled:opacity-50">{busy ? "處理中…" : "更新會員資料"}</button>
                </form>
                <div className="rounded-2xl bg-sand/60 border border-line p-4 mt-4">
                  <p className="text-[11px] text-subtle">最近一次香氣探索</p>
                  <p className="font-serif text-sm text-ink mt-1">{lastScent ? `${lastScent.name}｜${lastScent.scentFamily}` : "完成香氣探索後，登入會員帳戶即可保存結果。"}</p>
                </div>
                <button onClick={async () => { await supabaseClient.auth.signOut(); setMessage("已登出。"); }} className="w-full mt-4 py-3 rounded-xl border border-line text-xs text-muted hover:bg-paper">登出</button>
              </div>
            ) : (
              <div>
                <div className="flex gap-2 mb-5">
                  {[["login", "登入"], ["register", "加入會員"]].map(([key, label]) => (
                    <button key={key} onClick={() => { setMode(key); setMessage(""); }} className={`flex-1 rounded-xl py-2.5 text-xs ${mode === key ? "bg-ink text-paper" : "bg-paper border border-line text-muted"}`}>{label}</button>
                  ))}
                </div>
                <form onSubmit={submit} className="space-y-4">
                  {mode === "register" && <label className="block text-xs text-muted">稱呼<input value={name} onChange={(event) => setName(event.target.value)} required className="mt-1 w-full rounded-xl border border-line bg-paper px-3 py-3 text-sm text-ink outline-none focus:border-amberAccent" /></label>}
                  {mode !== "recover" && <label className="block text-xs text-muted">電郵地址<input type="email" autoComplete="email" value={email} onChange={(event) => setEmail(event.target.value)} required className="mt-1 w-full rounded-xl border border-line bg-paper px-3 py-3 text-sm text-ink outline-none focus:border-amberAccent" /></label>}
                  {mode !== "reset" && <label className="block text-xs text-muted">{mode === "recover" ? "新密碼" : "密碼"}<input type="password" autoComplete={mode === "register" ? "new-password" : "current-password"} minLength="8" value={password} onChange={(event) => setPassword(event.target.value)} required className="mt-1 w-full rounded-xl border border-line bg-paper px-3 py-3 text-sm text-ink outline-none focus:border-amberAccent" /></label>}
                  {mode === "register" && <label className="flex items-start gap-2 rounded-xl border border-line bg-paper/70 p-3 text-[11px] text-muted leading-relaxed"><input type="checkbox" required className="mt-0.5 accent-amber-700" /><span>我已閱讀下方會員資料使用說明，並同意以電郵管理會員帳戶及保存香氣探索結果。</span></label>}
                  <button disabled={busy} className="w-full rounded-xl bg-ink px-4 py-3.5 text-xs tracking-widest text-paper disabled:opacity-50">{busy ? "處理中…" : mode === "register" ? "建立會員帳戶" : mode === "reset" ? "寄出重設連結" : mode === "recover" ? "更新密碼" : "登入"}</button>
                </form>
                {mode === "login" && <button onClick={() => { setMode("reset"); setMessage(""); }} className="text-xs text-subtle underline mt-4">忘記密碼？</button>}
                {mode !== "login" && mode !== "recover" && <button onClick={() => { setMode("login"); setMessage(""); }} className="text-xs text-subtle underline mt-4 block">返回登入</button>}
                {mode === "recover" && <p className="text-[11px] text-subtle mt-3">請輸入新密碼（最少 8 個字元）。</p>}
              </div>
            )}
            {message && <p role="status" className="text-xs text-amberAccent leading-relaxed mt-4">{message}</p>}
            <details className="text-[10px] text-subtle/80 leading-relaxed mt-5 border-t border-line pt-4">
              <summary className="cursor-pointer">會員資料使用說明</summary>
              <p className="mt-2">登入電郵由 Supabase Auth 管理；會員資料表只保存稱呼、最近一次香氣探索結果及建立／更新時間，用於會員登入和個人化記錄。此頁不會公開會員資料，也不會保存詢價表格內容。正式開放註冊前，請先補上完整私隱聲明及資料查詢／刪除聯絡方式。</p>
            </details>
            <p className="text-[10px] text-subtle/80 leading-relaxed mt-3">本頁尚未設定購物積分或折扣規則。</p>
          </div>
        </div>
      );
    }

    // ==========================================
    // 10. 工作坊預約 Modal 彈窗組件
    // ==========================================
    function WorkshopModal({ isOpen, onClose }) {
      if (!isOpen) return null;
      const wsMsg = encodeURIComponent("你好，我想預約灣仔「心靈鏡像」調香工作坊席位（姓名： 人數：）：");

      return (
        <div className="fixed inset-0 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-paperCard rounded-3xl p-7 max-w-sm w-full shadow-float border border-line animate-fade-in">
            <h4 className="font-serif text-lg font-medium text-ink mb-2">「心靈鏡像」調香工作坊 (HK$380)</h4>
            <div className="text-xs text-muted leading-relaxed mb-6 font-light space-y-2">
              <p><strong>體驗時長：</strong> 90 分鐘獨立沙龍手作</p>
              <p><strong>地點：</strong> 香港灣仔區獨立工作室（近灣仔地鐵站）</p>
              <p><strong>費用：</strong> HK$380 / 位（含所有調香材料與專屬作品）</p>
              <p className="text-[11px] text-subtle border-t border-line/60 pt-2">
                * 極小班名額有限，請選擇下方慣用方式發送預約訊息以鎖定席位。
              </p>
              <p className="text-[10px] text-subtle/80">
                * 本體驗僅供感官放鬆及生活儀式感，並非醫療或心理診斷服務。
              </p>
            </div>

            <div className="space-y-2">
              <a 
                href={`https://wa.me/85261314101?text=${wsMsg}`} 
                target="_blank" 
                rel="noopener noreferrer" 
                className="block w-full text-center py-3 bg-[#25D366] text-white text-xs tracking-wider rounded-xl hover:opacity-90 transition font-medium shadow-sm"
              >
                WhatsApp 快速預約席位
              </a>
              <a 
                href="https://ig.me/m/SCENTMIRAGE.LAB" 
                target="_blank" 
                rel="noopener noreferrer" 
                className="block w-full text-center py-3 bg-paper border border-line text-ink text-xs tracking-wider rounded-xl hover:border-ink transition font-medium"
              >
                Instagram 私訊預約 (@SCENTMIRAGE.LAB)
              </a>
            </div>

            <button 
              onClick={onClose} 
              type="button" 
              className="w-full mt-3 py-2.5 border border-line text-xs text-subtle rounded-xl hover:bg-paper transition cursor-pointer font-light"
            >
              關閉
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 11. 系統主控制器 (App Routing + 全站 Footer)
    // ==========================================
    function App() {
      const [view, setView] = useState('home');
      const [activeResultId, setActiveResultId] = useState(1);
      const [isWsOpen, setIsWsOpen] = useState(false);
      const [isMemberOpen, setIsMemberOpen] = useState(false);
      const [memberSession, setMemberSession] = useState(null);
      const [memberProfile, setMemberProfile] = useState(null);

      useEffect(() => {
        if (!supabaseClient) return;
        let mounted = true;
        const loadProfile = async (userId) => {
          const { data, error } = await supabaseClient.from("member_profiles").select("display_name,last_scent_id,created_at").eq("id", userId).maybeSingle();
          if (mounted && !error) setMemberProfile(data);
        };
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (!mounted) return;
          setMemberSession(session);
          if (session?.user?.id) loadProfile(session.user.id);
        });
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          if (!mounted) return;
          setMemberSession(session);
          if (!session) setMemberProfile(null);
          else window.setTimeout(() => { if (mounted) loadProfile(session.user.id); }, 0);
        });
        return () => {
          mounted = false;
          subscription.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!supabaseClient || !memberSession?.user?.id || view !== "result") return;
        supabaseClient.from("member_profiles").upsert({ id: memberSession.user.id, last_scent_id: activeResultId, updated_at: new Date().toISOString() }, { onConflict: "id" }).then(({ error }) => {
          if (error) console.error("Unable to save member scent choice", error);
          else setMemberProfile((profile) => ({ ...(profile || {}), last_scent_id: activeResultId }));
        });
      }, [memberSession?.user?.id, activeResultId, view]);

      const refreshMemberProfile = async () => {
        if (!supabaseClient || !memberSession?.user?.id) return;
        const { data, error } = await supabaseClient.from("member_profiles").select("display_name,last_scent_id,created_at").eq("id", memberSession.user.id).maybeSingle();
        if (!error) setMemberProfile(data);
      };

      const handleStartQuiz = () => setView('quiz');
      const handleStartDraw = () => setView('draw');

      const handleCompleteQuiz = (finalId) => {
        setActiveResultId(finalId);
        setView('result');
      };

      const handleCardSelected = (cardId) => {
        setActiveResultId(cardId);
        setView('result');
      };

      const handleSkipToCatalog = () => {
        setActiveResultId(1);
        setView('result');
        setTimeout(() => {
          const el = document.getElementById('catalog-section');
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      };

      const handleReset = () => {
        setView('home');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className={`min-h-screen flex flex-col justify-between ${view === "corporate" || view === "spatial" ? "max-w-5xl" : "max-w-xl"} mx-auto px-5 py-6 md:py-10`}>
          <Header 
            onReset={handleReset} 
            onDirectCatalog={handleSkipToCatalog}
            onOpenWorkshop={() => setIsWsOpen(true)}
            onOpenCorporate={() => { setView("corporate"); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            onOpenSpatial={() => { setView("spatial"); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            onOpenMember={() => setIsMemberOpen(true)}
          />

          <main className="flex-1 flex flex-col justify-center">
            {view === 'home' && (
              <>
                <HomeView 
                  onStartQuiz={handleStartQuiz} 
                  onStartDraw={handleStartDraw} 
                  onSkipToCatalog={handleSkipToCatalog}
                />
                
                {/* 商業 B2B 專用入口卡片群組 */}
                <section className="grid sm:grid-cols-3 gap-3 mt-4 animate-fade-in">
                  <button onClick={() => { setView("spatial"); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="text-left bg-paperCard rounded-2xl p-5 border border-line shadow-salon hover:border-amberAccent transition cursor-pointer">
                    <span className="font-cormorant text-[10px] tracking-[0.25em] uppercase text-amberAccent font-medium">FOR SPACES</span>
                    <span className="font-serif text-sm text-ink block mt-1">商業空間香氣</span>
                    <span className="text-[11px] text-subtle block mt-1">沙龍、診所與門市無水冷霧化擴香方案 →</span>
                  </button>

                  <button onClick={() => { setView("corporate"); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="text-left bg-paperCard rounded-2xl p-5 border border-line shadow-salon hover:border-amberAccent transition cursor-pointer">
                    <span className="font-cormorant text-[10px] tracking-[0.25em] uppercase text-amberAccent font-medium">FOR BUSINESS</span>
                    <span className="font-serif text-sm text-ink block mt-1">企業香氣禮贈</span>
                    <span className="text-[11px] text-subtle block mt-1">為品牌活動與企業心意索取客製報價 →</span>
                  </button>

                  <button onClick={() => setIsMemberOpen(true)} className="text-left bg-paperCard rounded-2xl p-5 border border-line shadow-salon hover:border-amberAccent transition cursor-pointer">
                    <span className="font-cormorant text-[10px] tracking-[0.25em] uppercase text-amberAccent font-medium">MEMBER</span>
                    <span className="font-serif text-sm text-ink block mt-1">SCENT MIRAGE 會員</span>
                    <span className="text-[11px] text-subtle block mt-1">登入並保存最近一次香氣探索結果 →</span>
                  </button>
                </section>
              </>
            )}

            {view === 'spatial' && <SpatialScentView onBack={handleReset} />}
            {view === 'corporate' && <CorporateGiftsView onBack={handleReset} />}

            {view === 'quiz' && (
              <QuizView 
                onCompleteQuiz={handleCompleteQuiz} 
                onBackHome={handleReset} 
              />
            )}

            {view === 'draw' && (
              <CardDrawView 
                onCardSelected={handleCardSelected} 
                onBackHome={handleReset} 
              />
            )}

            {view === 'result' && (
              <ResultView 
                resultId={activeResultId} 
                onReset={handleReset} 
                onOpenWorkshopModal={() => setIsWsOpen(true)}
              />
            )}
          </main>

          <MemberModal
            isOpen={isMemberOpen}
            onClose={() => setIsMemberOpen(false)}
            session={memberSession}
            profile={memberProfile}
            onProfileChanged={refreshMemberProfile}
          />
          
          <WorkshopModal 
            isOpen={isWsOpen} 
            onClose={() => setIsWsOpen(false)} 
          />

          <footer className="mt-14 pt-8 border-t border-line text-center text-[11px] text-subtle leading-relaxed space-y-4 font-light">
            <div className="max-w-lg mx-auto bg-sand/30 p-4 rounded-2xl border border-line/60">
              <p className="font-medium text-ink mb-1">【免責聲明 Disclaimer】</p>
              <p className="text-[10px] text-muted leading-normal">
                SCENT MIRAGE 產品及工作坊體驗僅供感官放鬆及生活儀式感，並非醫療用品，不可用於診斷、治療或預防任何心理或生理狀態。
              </p>
              <p className="text-[10px] text-subtle mt-2 pt-2 border-t border-line/40">
                全系列香水油採 5% 純精油調配無酒精配方，僅供外用塗抹於手腕、頸部等脈搏處。孕婦、嬰幼兒或特殊體質者使用前請諮詢專業芳療或醫藥人員。
              </p>
            </div>

            <p className="text-[10px] text-subtle/70 font-mono tracking-wider">
              © 2026 SCENT MIRAGE. All Rights Reserved.
            </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
