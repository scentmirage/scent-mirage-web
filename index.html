<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCENT MIRAGE × AromaMood ｜ 獨立調香沙龍與日常感官探索</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: 襯線與無襯線 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F9F6F0',
            paperCard: '#FFFFFF',
            ink: '#262220',
            muted: '#6E665F',
            subtle: '#8C827A',
            line: '#E5DFD5',
            sand: '#F2ECE1',
            amberAccent: '#9E6D38',
            amberLight: '#F5EFEB',
          },
          fontFamily: {
            serif: ['"Noto Serif TC"', 'serif'],
            cormorant: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          boxShadow: {
            'salon': '0 4px 20px -2px rgba(38, 34, 32, 0.05), 0 2px 6px -1px rgba(38, 34, 32, 0.02)',
            'float': '0 20px 30px -10px rgba(38, 34, 32, 0.08), 0 1px 3px rgba(38, 34, 32, 0.05)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F9F6F0;
      color: #262220;
      font-family: 'Noto Sans TC', sans-serif;
      background-image: 
        radial-gradient(at 100% 0%, rgba(242, 236, 225, 0.8) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(235, 227, 213, 0.6) 0px, transparent 50%);
      background-attachment: fixed;
    }
  </style>
</head>
<body class="selection:bg-amberAccent/20 selection:text-ink antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const CONFIG = {
      GUMROAD_JOURNAL_URL: "https://gumroad.com", 
      OFFICIAL_EMAIL: "contact@scentmirage.com",
      INSTAGRAM_HANDLE: "@SCENTMIRAGE.LAB"
    };

    const QUIZ_QUESTIONS = [
      {
        id: 1,
        stepLabel: "生活節奏自述",
        title: "回想今天一整天的狀態，你此刻最真實的節奏是？",
        desc: "不需評判好壞，只做誠實的生活觀察",
        options: [
          { label: "待辦繁多，思緒難以停歇", tag: "待辦較多", hint: "需要一個溫和的切換開關" },
          { label: "剛結束密集社交，想沉澱安靜", tag: "社交沉澱", hint: "渴望感官安靜與物理留白" },
          { label: "正在多重角色與任務間頻繁轉換", tag: "角色切換", hint: "為不同狀態建立清晰邊界" },
          { label: "節奏平緩，只想為日常留一點純粹空白", tag: "日常留白", hint: "沉浸於當下純粹呼吸" }
        ]
      },
      {
        id: 2,
        stepLabel: "香氣畫面聯想",
        title: "如果有一種氣味能代表你此刻渴望的空間感：",
        desc: "挑選最能讓你聯想到安定的場景質地",
        options: [
          { label: "乾燥的老木工作台與翻開的紙張墨香", family: "木質調 Woody", top: "苦橙葉", mid: "雪松與乾燥紙張", base: "檀香木" },
          { label: "清晨帶露水的草葉茶與舒展的微風", family: "草本調 Herbal", top: "尤加利", mid: "迷迭香茶香", base: "快樂鼠尾草" },
          { label: "灑滿溫暖陽光的窗台與清脆果皮", family: "柑橘調 Citrus", top: "佛手柑皮", mid: "甜橙果肉", base: "溫暖安息香" },
          { label: "微風吹過開闊田野的乾燥草香與泥土", family: "大地調 Earthy", top: "粉紅胡椒", mid: "岩蘭草", base: "廣藿香" }
        ]
      },
      {
        id: 3,
        stepLabel: "氣味調性偏好",
        title: "在香氣質地上，你直覺更受哪種觸感吸引？",
        desc: "如同指尖撫摸布料般的肌理偏好",
        options: [
          { label: "沉穩、包覆感強的厚實溫暖", tone: "深層沉靜", tag: "沉實質樸" },
          { label: "通透、帶有空氣流通感的明亮清新", tone: "通透開闊", tag: "輕盈舒展" },
          { label: "微苦、不甜膩的植物原生氣息", tone: "自然原萃", tag: "草木微苦" },
          { label: "溫和、像曬乾棉麻布料般的潔淨感", tone: "柔潤親膚", tag: "溫潤淨白" }
        ]
      },
      {
        id: 4,
        stepLabel: "日常轉場時段",
        title: "你最想為一天中的哪一個時光，安放一個 3 分鐘小儀式？",
        desc: "為生活標記一個具體、可落地的感官錨點",
        options: [
          { label: "晨間出門前，為新的一天設定安定的錨點", time: "晨間開啟", badge: "Morning Anchor" },
          { label: "工作結束時，合上電腦標記任務的段落", time: "工作結尾", badge: "Closing Workday" },
          { label: "傍晚歸家後，洗淨喧囂與切換生活角色", time: "傍晚轉場", badge: "Evening Transition" },
          { label: "睡前熄燈前，讓大腦正式卸下所有重擔", time: "深夜留白", badge: "Night Rest" }
        ]
      }
    ];

    function App() {
      // 0: 首頁, 1~4: 測驗, 5: 結果頁
      const [step, setStep] = useState(0); 
      const [answers, setAnswers] = useState({});
      const [copied, setCopied] = useState(false);
      const [modalContent, setModalContent] = useState(null);

      const handleSelectOption = (qIdx, opt) => {
        setAnswers(prev => ({ ...prev, [qIdx]: opt }));
      };

      const handleNext = () => {
        if (step >= 1 && step < 4) {
          setStep(step + 1);
        } else if (step === 4) {
          setStep(5); // 進入結果頁
        }
      };

      const handlePrev = () => {
        if (step > 1) {
          setStep(step - 1);
        } else {
          setStep(0);
        }
      };

      const handleRestart = () => {
        setAnswers({});
        setStep(0);
        setCopied(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const copyResult = () => {
        const text = `【SCENT MIRAGE 香氣靈感卡】\n生活節奏：${answers[0]?.tag || "日常覺察"}\n偏好香調：${answers[1]?.family || "木質草本"}\n質感偏好：${answers[2]?.tone || "沉靜留白"}\n轉場時刻：${answers[3]?.time || "日常時段"}\n（本卡僅供個人感官探索，無醫療療效）`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-xl mx-auto px-5 py-8 md:py-12">
          
          {/* Header 品牌標誌 */}
          <header className="text-center mb-8">
            <div className="inline-flex items-center gap-2 px-3 py-1 bg-sand/80 rounded-full border border-line/60 mb-2.5">
              <span className="w-1.5 h-1.5 rounded-full bg-amberAccent"></span>
              <span className="text-[10px] tracking-[0.25em] uppercase text-muted font-medium">Apothecary Atelier</span>
            </div>
            <h1 className="font-cormorant text-3xl md:text-4xl tracking-[0.2em] font-medium uppercase text-ink">
              SCENT MIRAGE
            </h1>
            <p className="font-serif text-xs tracking-widest text-subtle mt-1 font-light">
              獨立調香沙龍 ｜ 日常感官留白練習
            </p>
          </header>

          {/* 主工作區 */}
          <main className="flex-1 flex flex-col justify-center">

            {/* Step 0: 首頁引導 */}
            {step === 0 && (
              <div className="bg-paperCard rounded-3xl p-8 md:p-10 shadow-salon border border-line text-center relative overflow-hidden">
                <div className="w-12 h-12 bg-amberLight rounded-2xl flex items-center justify-center mx-auto mb-6 text-amberAccent border border-line/60">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                </div>

                <span className="text-[11px] font-medium tracking-[0.2em] uppercase text-amberAccent block mb-2">
                  1-Minute Exploration
                </span>
                
                <h2 className="font-serif text-2xl md:text-3xl text-ink font-normal leading-snug mb-3">
                  用 1 分鐘探索<br />此刻偏好的香氣氛圍
                </h2>
                
                <p className="text-xs md:text-sm text-muted leading-relaxed font-light max-w-md mx-auto mb-8">
                  氣味不是重整狀態的靈丹妙藥，而是一枚溫和的感官提示——就像在翻閱下一頁之前，輕輕放下一枚書籤。回答 4 個生活直覺問題，整理專屬於你的留白靈感卡。
                </p>

                <button
                  onClick={() => setStep(1)}
                  className="w-full py-4 bg-ink text-paper text-xs tracking-[0.25em] font-medium rounded-2xl hover:bg-ink/90 active:scale-[0.99] transition shadow-md flex items-center justify-center gap-2"
                >
                  <span>開始香氣探索</span>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                  </svg>
                </button>

                <p className="text-[11px] text-subtle mt-5 leading-normal font-light">
                  * 僅供個人感官生活記錄，不作醫療或心理診斷，亦不保證任何生理效果。
                </p>
              </div>
            )}

            {/* Step 1 ~ 4: 測驗流程 */}
            {step >= 1 && step <= 4 && (
              <div className="bg-paperCard rounded-3xl p-7 md:p-9 shadow-salon border border-line relative">
                
                {/* 進度條指示 */}
                <div className="mb-6">
                  <div className="flex justify-between items-center text-xs text-subtle mb-2.5">
                    <span className="font-medium tracking-wider text-amberAccent">
                      {QUIZ_QUESTIONS[step - 1].stepLabel}
                    </span>
                    <div className="flex items-center gap-3">
                      <span className="font-mono text-[11px]">0{step} / 04</span>
                      <button 
                        onClick={handlePrev}
                        className="text-[11px] text-muted hover:text-ink underline transition font-light"
                      >
                        返回
                      </button>
                    </div>
                  </div>
                  <div className="w-full bg-sand h-1.5 rounded-full overflow-hidden">
                    <div 
                      className="bg-amberAccent h-full transition-all duration-300 ease-out rounded-full" 
                      style={{ width: `${(step / 4) * 100}%` }}
                    ></div>
                  </div>
                </div>

                {/* 題目 */}
                <h3 className="font-serif text-xl md:text-2xl text-ink font-normal mb-1.5 leading-snug">
                  {QUIZ_QUESTIONS[step - 1].title}
                </h3>
                <p className="text-xs text-subtle font-light mb-6">
                  {QUIZ_QUESTIONS[step - 1].desc}
                </p>

                {/* 選項列表 */}
                <div className="space-y-3 mb-8">
                  {QUIZ_QUESTIONS[step - 1].options.map((opt, idx) => {
                    const isSelected = answers[step - 1]?.label === opt.label;
                    return (
                      <div
                        key={idx}
                        onClick={() => handleSelectOption(step - 1, opt)}
                        className={`p-4 rounded-2xl border text-left cursor-pointer transition-all duration-200 flex items-center justify-between ${
                          isSelected
                            ? "border-amberAccent bg-amberLight/70 ring-1 ring-amberAccent shadow-sm"
                            : "border-line bg-paper/50 hover:bg-paper hover:border-muted/50"
                        }`}
                      >
                        <div>
                          <div className={`text-xs md:text-sm leading-relaxed ${isSelected ? "text-ink font-medium" : "text-ink/90"}`}>
                            {opt.label}
                          </div>
                          {opt.hint && (
                            <div className="text-[11px] text-subtle mt-0.5 font-light">{opt.hint}</div>
                          )}
                        </div>
                        <div className={`w-5 h-5 rounded-full flex items-center justify-center border text-xs ml-3 shrink-0 ${
                          isSelected ? "border-amberAccent bg-amberAccent text-white" : "border-line bg-white"
                        }`}>
                          {isSelected && "✓"}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* 前進按鈕 */}
                <button
                  disabled={!answers[step - 1]}
                  onClick={handleNext}
                  className={`w-full py-4 text-xs tracking-[0.25em] font-medium rounded-2xl transition duration-200 flex items-center justify-center gap-2 ${
                    answers[step - 1]
                      ? "bg-ink text-paper hover:bg-ink/90 active:scale-[0.99] shadow-md cursor-pointer"
                      : "bg-line/70 text-subtle/50 cursor-not-allowed"
                  }`}
                >
                  <span>{step === 4 ? "查看專屬香氣靈感卡" : "下一題"}</span>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                  </svg>
                </button>
              </div>
            )}

            {/* Step 5: 結果卡 + 3 大商品 */}
            {step === 5 && (
              <div className="space-y-8 animate-fade-in">
                
                {/* 靈感卡視覺 */}
                <div className="bg-paperCard rounded-3xl p-7 md:p-9 shadow-float border border-line relative overflow-hidden">
                  <div className="flex justify-between items-start border-b border-line pb-4 mb-6">
                    <div>
                      <span className="font-cormorant text-xs tracking-[0.3em] uppercase text-amberAccent font-semibold block">
                        Scent Inspiration Card
                      </span>
                      <h3 className="font-serif text-2xl md:text-3xl text-ink font-normal mt-1">
                        {answers[3]?.time || "日常"}・{answers[1]?.family?.split(" ")[0] || "沉靜"}靈感
                      </h3>
                    </div>
                    <span className="px-3 py-1 bg-sand text-amberAccent text-[11px] font-medium rounded-full border border-line/60">
                      {answers[0]?.tag || "日常覺察"}
                    </span>
                  </div>

                  {/* 核心指標 */}
                  <div className="grid grid-cols-2 gap-3 text-xs mb-6">
                    <div className="bg-paper p-4 rounded-2xl border border-line/60">
                      <span className="text-subtle block text-[11px] mb-1 font-light">偏好香調場景</span>
                      <strong className="text-ink font-medium text-sm">{answers[1]?.family || "木質調 Woody"}</strong>
                    </div>
                    <div className="bg-paper p-4 rounded-2xl border border-line/60">
                      <span className="text-subtle block text-[11px] mb-1 font-light">觸感肌理偏好</span>
                      <strong className="text-ink font-medium text-sm">{answers[2]?.tone || "通透開闊"}</strong>
                    </div>
                  </div>

                  {/* 香氣三層結構聯想 */}
                  <div className="bg-sand/40 border border-line/80 rounded-2xl p-4 text-xs space-y-2 mb-6">
                    <div className="flex items-center text-muted">
                      <span className="w-14 text-subtle shrink-0 font-light">前調印象</span>
                      <span className="text-ink font-medium">{answers[1]?.top || "清新果皮與晨光微風"}</span>
                    </div>
                    <div className="flex items-center text-muted">
                      <span className="w-14 text-subtle shrink-0 font-light">中調場景</span>
                      <span className="text-ink font-medium">{answers[1]?.mid || "乾燥紙張與草葉茶香"}</span>
                    </div>
                    <div className="flex items-center text-muted">
                      <span className="w-14 text-subtle shrink-0 font-light">尾調質地</span>
                      <span className="text-ink font-medium">{answers[1]?.base || "溫暖老木與大地收束"}</span>
                    </div>
                    <p className="text-[10px] text-subtle pt-2 border-t border-line/60 font-light">
                      * 上述香調為感官意象聯想，非直接皮膚塗抹處方。
                    </p>
                  </div>

                  {/* 操作列 */}
                  <div className="flex gap-3">
                    <button
                      onClick={copyResult}
                      className="flex-1 py-3 text-xs tracking-wider bg-paper border border-line text-ink rounded-xl hover:border-amberAccent transition font-medium flex items-center justify-center gap-2"
                    >
                      <span>{copied ? "已複製到剪貼簿 ✓" : "複製此靈感卡"}</span>
                    </button>
                    <button
                      onClick={handleRestart}
                      className="px-5 py-3 text-xs text-subtle hover:text-ink transition font-light underline"
                    >
                      重新探索
                    </button>
                  </div>
                </div>

                {/* 3 大唯一核准商品入口 */}
                <div className="space-y-4 pt-2">
                  <div className="flex items-center gap-2 px-1">
                    <span className="w-1 h-3.5 bg-amberAccent rounded-full"></span>
                    <h4 className="font-serif text-sm font-medium tracking-wider text-ink">
                      將感官練習延續至日常生活
                    </h4>
                  </div>

                  {/* 商品 1: 手札 */}
                  <div className="bg-paperCard p-6 rounded-3xl border border-line shadow-salon flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] tracking-wider uppercase bg-sand px-2.5 py-0.5 rounded-full text-amberAccent font-medium border border-line/60">
                        即時數位下載
                      </span>
                      <h5 className="font-serif text-base font-medium text-ink mt-2">《7 日香氣轉場手札》數位版</h5>
                      <p className="text-xs text-subtle mt-1 font-light">含
