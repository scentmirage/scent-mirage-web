<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>靈魂處方箋 ｜ SCENT MIRAGE</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: 襯線與無襯線 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F9F6F0',
            paperCard: '#FFFFFF',
            ink: '#262220',
            muted: '#6E665F',
            subtle: '#8C827A',
            line: '#E5DFD5',
            sand: '#F2ECE1',
            amberAccent: '#9E6D38',
            amberLight: '#F5EFEB',
          },
          fontFamily: {
            serif: ['"Noto Serif TC"', 'serif'],
            cormorant: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          boxShadow: {
            'salon': '0 4px 20px -2px rgba(38, 34, 32, 0.05), 0 2px 6px -1px rgba(38, 34, 32, 0.02)',
            'float': '0 20px 30px -10px rgba(38, 34, 32, 0.08), 0 1px 3px rgba(38, 34, 32, 0.05)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F9F6F0;
      color: #262220;
      font-family: 'Noto Sans TC', sans-serif;
      background-image: 
        radial-gradient(at 100% 0%, rgba(242, 236, 225, 0.8) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(235, 227, 213, 0.6) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* 3D 翻牌基礎設定 */
    .perspective-container {
      perspective: 1200px;
    }

    .card-flipper {
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      transform: rotateY(180deg);
    }

    /* 淡出隱藏未選中的牌 */
    .fade-out-unselected {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
      transition: all 0.5s ease-out;
    }
  </style>
</head>
<body class="selection:bg-amberAccent/20 selection:text-ink antialiased">
  
  <div class="min-h-screen flex flex-col justify-between max-w-xl mx-auto px-5 py-8 md:py-12">
    
    <!-- 頂部 Header -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-sand/80 rounded-full border border-line/60 mb-2.5">
        <span class="w-1.5 h-1.5 rounded-full bg-amberAccent"></span>
        <span class="text-[10px] tracking-[0.25em] uppercase text-muted font-medium">Soul Prescription</span>
      </div>
      <h1 class="font-cormorant text-3xl md:text-4xl tracking-[0.2em] font-medium uppercase text-ink">
        SCENT MIRAGE
      </h1>
      <p class="font-serif text-xs tracking-widest text-subtle mt-1 font-light">
        靈魂處方箋 ｜ 日常感官直覺指引
      </p>
    </header>

    <!-- 主互動區域 -->
    <main class="flex-1 flex flex-col justify-center">

      <!-- 狀態提示語 -->
      <div id="ui-instruction" class="text-center mb-8 transition-opacity duration-500">
        <h2 class="font-serif text-lg md:text-xl text-ink font-normal leading-snug">
          深呼吸三次。
        </h2>
        <p class="text-xs md:text-sm text-subtle font-light mt-1.5 tracking-wide">
          憑直覺，點擊最吸引你的那張牌。
        </p>
      </div>

      <!-- 卡牌容器 (5張牌排版，支援 RWD 平板與手機滑動/均分) -->
      <div id="cards-grid" class="flex justify-center items-center gap-2.5 sm:gap-4 overflow-x-auto py-4 px-1 no-scrollbar transition-all duration-700">
        <!-- 卡牌將由 JavaScript 洗牌後動態渲染 -->
      </div>

      <!-- 揭曉處方詳情 (預設隱藏，點牌後優雅淡入) -->
      <section id="result-panel" class="hidden opacity-0 transition-all duration-700 mt-6 bg-paperCard rounded-3xl p-6 md:p-8 shadow-float border border-line">
        
        <div class="border-b border-line pb-4 mb-5 text-center">
          <span class="font-cormorant text-xs tracking-[0.3em] uppercase text-amberAccent font-semibold block mb-1">
            Your Scent Prescription
          </span>
          <h3 id="res-name" class="font-serif text-xl md:text-2xl text-ink font-normal"></h3>
        </div>

        <div class="space-y-4 mb-6 text-xs leading-relaxed">
          <!-- 香調資訊 -->
          <div class="bg-sand/40 border border-line/80 rounded-2xl p-4">
            <span class="text-subtle block text-[11px] font-light mb-1">專屬配方香調</span>
            <strong id="res-scent" class="text-ink font-medium text-sm"></strong>
          </div>

          <!-- 適合狀態 -->
          <div class="bg-paper p-4 rounded-2xl border border-line/60">
            <span class="text-subtle block text-[11px] font-light mb-1">感官處方註解</span>
            <p id="res-desc" class="text-muted font-light text-xs"></p>
          </div>

          <!-- 靈魂金句 -->
          <blockquote class="border-l-2 border-amberAccent pl-4 py-1 my-3 italic text-ink/90 font-serif text-sm">
            <span id="res-quote"></span>
          </blockquote>
        </div>

        <!-- 外部結帳 CTA -->
        <div class="space-y-3">
          <a id="res-checkout-btn" href="#" target="_blank" rel="noopener noreferrer" class="w-full py-4 bg-ink text-paper text-xs tracking-[0.25em] font-medium rounded-2xl hover:bg-ink/90 active:scale-[0.99] transition shadow-md flex items-center justify-center gap-2 cursor-pointer">
            <span>訂製我的專屬處方 (HKD $220)</span>
            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </a>

          <button id="res-retry-btn" type="button" class="w-full py-2.5 text-xs text-subtle hover:text-ink font-light underline transition cursor-pointer text-center">
            重新靜心抽牌
          </button>
        </div>

        <p class="text-[10px] text-subtle text-center mt-4 font-light">
          * 結帳後將由獨立調香沙龍按處方現調封裝，3-5 個工作天內寄出。
        </p>
      </section>

    </main>

    <!-- 底部版權 -->
    <footer class="mt-12 pt-6 border-t border-line text-center text-[10px] text-subtle/70 font-mono tracking-wider">
      © 2026 SCENT MIRAGE APOTHECARY. All Rights Reserved.
    </footer>

  </div>

  <script>
    // 預設資料陣列
    const CARD_DATA = [
      {
        "id": 1,
        "name": "隱士 (The Hermit)｜隱形結界",
        "scent": "木質泥土調 (佛手柑 / 秘魯聖木 / 岩蘭草)",
        "description": "適合社交疲勞、渴望獨處、覺得被外界情緒越界時的你。",
        "quote": "「世界太吵的時候，允許自己暫時躲進這片安靜的森林。」",
        "stripeUrl": "YOUR_STRIPE_LINK_1",
        "image": "/images/card-hermit.jpg"
      },
      {
        "id": 2,
        "name": "節制 (Temperance)｜大腦熄機",
        "scent": "草本樹脂調 (羅馬洋甘菊 / 真正薰衣草 / 乳香)",
        "description": "適合思緒混亂、焦慮失眠、下班後依然無法停止精神內耗的你。",
        "quote": "「今天辛苦了，現在你可以安全地放下所有防備。」",
        "stripeUrl": "YOUR_STRIPE_LINK_2",
        "image": "/images/card-temperance.jpg"
      },
      {
        "id": 3,
        "name": "皇后 (The Empress)｜溫柔擁抱",
        "scent": "溫暖花木調 (甜橙 / 天竺葵 / 花梨木)",
        "description": "適合感到自我價值低落、孤獨、剛經歷挫折需要被溫柔接住的你。",
        "quote": "「不用急著堅強，你可以先好好接納自己的脆弱。」",
        "stripeUrl": "YOUR_STRIPE_LINK_3",
        "image": "/images/card-empress.jpg"
      },
      {
        "id": 4,
        "name": "愚者 (The Fool)｜澄明之境",
        "scent": "清新柑橘調 (葡萄柚 / 胡椒薄荷 / 絲柏)",
        "description": "適合腦袋昏沉、陷入迷霧，需要瞬間喚醒感官與重新出發的你。",
        "quote": "「深呼吸，將一切歸零，然後輕裝上陣。」",
        "stripeUrl": "YOUR_STRIPE_LINK_4",
        "image": "/images/card-fool.jpg"
      },
      {
        "id": 5,
        "name": "力量 (Strength)｜無畏底氣",
        "scent": "沉穩辛木調 (黑胡椒 / 豆蔻 / 廣藿香)",
        "description": "適合面對挑戰、重要會議前，需要強大氣場與自信心保護的你。",
        "quote": "「你擁有的力量，比你想像中強大得多。」",
        "stripeUrl": "YOUR_STRIPE_LINK_5",
        "image": "/images/card-strength.jpg"
      }
    ];

    let currentShuffledCards = [];
    let isSelected = false;

    // 洗牌演算法 (Fisher-Yates)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 初始化與渲染卡牌
    function initCards() {
      isSelected = false;
      currentShuffledCards = shuffleArray(CARD_DATA);

      const grid = document.getElementById("cards-grid");
      const instruction = document.getElementById("ui-instruction");
      const resultPanel = document.getElementById("result-panel");

      // 重設狀態與排版
      instruction.classList.remove("opacity-0");
      resultPanel.classList.add("hidden");
      resultPanel.classList.remove("opacity-100");
      resultPanel.classList.add("opacity-0");

      grid.innerHTML = "";
      grid.className = "flex justify-center items-center gap-2 sm:gap-3.5 overflow-x-auto py-4 px-1 no-scrollbar transition-all duration-700";

      currentShuffledCards.forEach((card, index) => {
        const cardWrapper = document.createElement("div");
        cardWrapper.className = "perspective-container shrink-0 w-16 sm:w-24 md:w-28 cursor-pointer select-none transition-all duration-500 ease-out hover:-translate-y-2";
        cardWrapper.setAttribute("data-index", index);

        // 卡片雙面結構 (預留圖片 placeholder)
        cardWrapper.innerHTML = `
          <div class="card-flipper relative w-full aspect-[2/3] rounded-2xl shadow-salon">
            <!-- 卡背 (預設朝上) -->
            <div class="card-back absolute inset-0 w-full h-full rounded-2xl border border-line bg-sand flex flex-col items-center justify-center p-2 text-center overflow-hidden">
              <div class="w-full h-full border border-line/60 rounded-xl flex flex-col items-center justify-center bg-paperCard/50">
                <span class="w-1.5 h-1.5 rounded-full bg-amberAccent mb-1"></span>
                <span class="font-cormorant text-[9px] tracking-widest uppercase text-subtle">SCENT</span>
              </div>
            </div>

            <!-- 卡面 (正面揭露) -->
            <div class="card-front absolute inset-0 w-full h-full rounded-2xl border border-amberAccent/40 bg-paperCard flex flex-col items-center justify-between p-2 shadow-float overflow-hidden">
              <div class="w-full flex-1 rounded-lg bg-sand/60 flex items-center justify-center text-[10px] text-subtle font-serif border border-line/40 overflow-hidden">
                <img src="${card.image}" alt="${card.name}" onerror="this.parentElement.innerHTML='<span class=\\'font-serif text-[11px] text-ink p-1 text-center\\'>${card.name.split('｜')[0]}</span>'" class="w-full h-full object-cover">
              </div>
              <span class="text-[9px] font-serif text-ink tracking-tight mt-1 truncate w-full text-center">
                ${card.name.split('｜')[0]}
              </span>
            </div>
          </div>
        `;

        cardWrapper.addEventListener("click", () => handleCardClick(index));
        grid.appendChild(cardWrapper);
      });
    }

    // 處理卡牌點擊事件
    function handleCardClick(selectedIndex) {
      if (isSelected) return;
      isSelected = true;

      const selectedCardData = currentShuffledCards[selectedIndex];
      const allCards = document.querySelectorAll("#cards-grid > div");
      const instruction = document.getElementById("ui-instruction");
      const resultPanel = document.getElementById("result-panel");
      const grid = document.getElementById("cards-grid");

      // 1. 隱藏提示文字
      instruction.classList.add("opacity-0");

      // 2. 翻開點選的卡牌，其餘淡出隱藏
      allCards.forEach((cardEl, idx) => {
        const flipper = cardEl.querySelector(".card-flipper");
        if (idx === selectedIndex) {
          flipper.classList.add("is-flipped");
          // 將選中的牌放大為焦點卡片
          cardEl.className = "perspective-container w-28 sm:w-36 md:w-44 select-none transition-all duration-700 mx-auto";
        } else {
          cardEl.classList.add("fade-out-unselected");
          setTimeout(() => {
            cardEl.style.display = "none";
          }, 500);
        }
      });

      // 3. 填入資料並淡入處方區塊
      setTimeout(() => {
        document.getElementById("res-name").innerText = selectedCardData.name;
        document.getElementById("res-scent").innerText = selectedCardData.scent;
        document.getElementById("res-desc").innerText = selectedCardData.description;
        document.getElementById("res-quote").innerText = selectedCardData.quote;
        
        // 綁定 Stripe 結帳連結
        const checkoutBtn = document.getElementById("res-checkout-btn");
        checkoutBtn.href = selectedCardData.stripeUrl;

        resultPanel.classList.remove("hidden");
        // 強制重繪後觸發淡入
        setTimeout(() => {
          resultPanel.classList.remove("opacity-0");
          resultPanel.classList.add("opacity-100");
          resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
      }, 700);
    }

    // 綁定重抽按鈕
    document.getElementById("res-retry-btn").addEventListener("click", () => {
      initCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 頁面初次載入
    window.addEventListener("DOMContentLoaded", initCards);
  </script>
</body>
</html>
