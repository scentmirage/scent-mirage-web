<body class="selection:bg-amberAccent/20 selection:text-ink antialiased">

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // 1. 單一資料源 (Single Source of Truth)

    const PRESCRIPTIONS = [
      {

      {

        scent: "溫暖花木調 (甜橙 / 天竺葵 / 花梨木)",

        stripeUrl: "https://buy.stripe.com/cNi4gs7x3at6eRf44O7AI04",
        image: "/images/card-empress.jpg"
      },
      {

        name: "愚者 (The Fool)｜澄明之境",

        description: "適合腦袋昏沉、陷入迷霧，需要瞬間喚醒感官與重新出發的你。",
        quote: "「深呼吸，將一切歸零，然後輕裝上陣。」",
        stripeUrl: "https://buy.stripe.com/fZu9AM9Fb58McJ7gRA7AI05",
        image: "/images/card-fool.jpg"
      },
      {

        name: "力量 (Strength)｜無畏底氣",
        scent: "沉穩辛木調 (黑胡椒 / 豆蔻 / 廣藿香)",
        description: "適合面對挑戰、重要會議前，需要強大氣場與自信心保護的你。",
        quote: "「你擁有的力量，比你想像中強大得多。」",
        stripeUrl: "https://buy.stripe.com/28E7sE9Fb44IdNb58S7AI06",
        image: "/images/card-strength.jpg"
      }
    ];

    // ==========================================
    // 2. 測驗問題資料 (Mapping: A->2, B->1, C->3, D->4, E->5)
    // ==========================================
    const QUIZ_QUESTIONS = [
      {
        question: "回想最近的一週，你最常出現的狀態是？",
        subtitle: "覺察身體與思緒最真實的重量",
        options: [
          { key: "A", text: "腦袋轉不停，就算躺在床上也難以入睡。", targetId: 2 },
          { key: "B", text: "覺得一直被別人的情緒消耗，極度渴望與外界隔絕。", targetId: 1 },
          { key: "C", text: "容易自我懷疑，心情低落，覺得自己不夠好。", targetId: 3 },
          { key: "D", text: "腦袋昏沉，提不起勁，好像被困在迷霧裡。", targetId: 4 },
          { key: "E", text: "正在面對未知或重大挑戰，感到壓力和需要底氣。", targetId: 5 }
        ]
      },
      {
        question: "如果現在可以瞬間轉移，你最想將自己投放到哪一個空間？",
        subtitle: "讓感官直覺挑選此刻最渴望的歸宿",
        options: [
          { key: "A", text: "舒適柔軟的被窩中，沒有任何光線和聲音。", targetId: 2 },
          { key: "B", text: "一座無人的深山老林，只有樹木的氣息。", targetId: 1 },
          { key: "C", text: "充滿陽光的溫室花園，被溫暖包圍。", targetId: 3 },
          { key: "D", text: "呼吸著冷冽空氣的高山或海邊，極度開闊。", targetId: 4 },
          { key: "E", text: "站在高處俯瞰整座城市的觀景台，掌控一切。", targetId: 5 }
        ]
      },
      {
        question: "透過氣味，你此刻最希望獲得哪一種力量？",
        subtitle: "這是你為靈魂許下的溫和處方",
        options: [
          { key: "A", text: "徹底放鬆神經，什麼都不用管。", targetId: 2 },
          { key: "B", text: "建立一道防護罩，把別人的煩擾擋在外面。", targetId: 1 },
          { key: "C", text: "被溫柔地接納，允許自己脆弱。", targetId: 3 },
          { key: "D", text: "撥開思緒的迷霧，找回絕對的專注力。", targetId: 4 },
          { key: "E", text: "堅定立場，充滿不退縮的自信與勇氣。", targetId: 5 }
        ]
      }
    ];

    // ==========================================
    // 3. 通用頂部 Header 組件
    // ==========================================
    function Header({ onReset }) {
      return (
        <header className="text-center mb-8">
          <div 
            onClick={onReset}
            className="inline-flex items-center gap-2 px-3 py-1 bg-sand/80 rounded-full border border-line/60 mb-2.5 cursor-pointer hover:bg-sand transition"
          >
            <span className="w-1.5 h-1.5 rounded-full bg-amberAccent"></span>
            <span className="text-[10px] tracking-[0.25em] uppercase text-muted font-medium">Apothecary Atelier</span>
          </div>
          <h1 
            onClick={onReset}
            className="font-cormorant text-3xl md:text-4xl tracking-[0.2em] font-medium uppercase text-ink cursor-pointer"
          >
            SCENT MIRAGE
          </h1>
          <p className="font-serif text-xs tracking-widest text-subtle mt-1 font-light">
            靈魂處方箋 ｜ 日常感官留白練習
          </p>
        </header>
      );
    }

    // ==========================================
    // 4. 模組 1：主頁分流 (Homepage Routing)
    // ==========================================
    function HomeView({ onStartQuiz, onStartDraw }) {
      return (
        <section className="bg-paperCard rounded-3xl p-8 md:p-12 shadow-salon border border-line text-center animate-fade-in relative overflow-hidden">
          <div className="w-12 h-12 bg-amberLight rounded-2xl flex items-center justify-center mx-auto mb-6 text-amberAccent border border-line/60">
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          </div>

          <span className="text-[11px] font-medium tracking-[0.25em] uppercase text-amberAccent block mb-3">
            Soul Scent Exploration
          </span>
          <h2 className="font-serif text-2xl md:text-3xl text-ink font-normal leading-snug mb-3">
            此刻的你，<br className="sm:hidden" />靈魂需要什麼氣味？
          </h2>
          <p className="text-xs md:text-sm text-muted leading-relaxed font-light max-w-md mx-auto mb-10">
            氣味是情緒的處方箋。請選擇你此刻最想與自己對話的方式：
          </p>

          <div className="flex flex-col sm:flex-row gap-4 max-w-md mx-auto">
            {/* 按鈕 A：理性測驗 */}
            <button
              onClick={onStartQuiz}
              type="button"
              className="flex-1 py-4 px-4 bg-ink text-paper rounded-2xl text-xs tracking-widest font-medium hover:bg-ink/90 active:scale-[0.99] transition shadow-md flex items-center justify-center gap-2 cursor-pointer group"
            >
              <span>理性梳理：氣味潛意識測驗</span>
              <svg className="w-4 h-4 group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </button>

            {/* 按鈕 B：直覺抽卡 */}
            <button
              onClick={onStartDraw}
              type="button"
              className="flex-1 py-4 px-4 bg-paper border border-line text-ink rounded-2xl text-xs tracking-widest font-medium hover:border-amberAccent hover:bg-amberLight/40 active:scale-[0.99] transition flex items-center justify-center gap-2 cursor-pointer"
            >
              <span>直覺指引：抽取今日靈感卡</span>
            </button>
          </div>

          <p className="text-[11px] text-subtle mt-8 leading-normal font-light">
            * 僅供個人感官生活記錄，不作醫療或心理診斷。
          </p>
        </section>
      );
    }

    // ==========================================
    // 5. 模組 2：氣味潛意識測驗 (Quiz Funnel)
    // ==========================================
    function QuizView({ onCompleteQuiz, onBackHome }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [selectedIndex, setSelectedIndex] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      const q = QUIZ_QUESTIONS[currentQ];

      const handleSelectOption = (index, targetId) => {
        if (selectedIndex !== null) return;
        setSelectedIndex(index);

        const nextAnswers = [...answers, targetId];
        setAnswers(nextAnswers);

        // 點擊選項後自動延遲 0.5 秒進入下一題
        setTimeout(() => {
          if (currentQ < QUIZ_QUESTIONS.length - 1) {
            setCurrentQ(prev => prev + 1);
            setSelectedIndex(null);
          } else {
            // 完成 Q3 後展示 1.5 秒 Loading 動畫
            setIsLoading(true);
            setTimeout(() => {
              const finalId = calculateScoring(nextAnswers);
              onCompleteQuiz(finalId);
            }, 1500);
          }
        }, 500);
      };

      // 計分邏輯：眾數 (Mode)；若 3 題皆不同 (平局)，以 Q3 選擇之 id 作為最終結果
      const calculateScoring = (ansArr) => {
        const counts = {};
        ansArr.forEach(id => { counts[id] = (counts[id] || 0) + 1; });

        let maxCount = 0;
        let modeId = null;
        let tie = false;

        for (const id in counts) {
          if (counts[id] > maxCount) {
            maxCount = counts[id];
            modeId = Number(id);
            tie = false;
          } else if (counts[id] === maxCount) {
            tie = true;
          }
        }

        // 3 題各選不同 id (maxCount = 1) 或平局，直接採用 Q3 的答案
        if (maxCount === 1 || tie) {
          return ansArr[2];
        }
        return modeId;
      };

      if (isLoading) {
        return (
          <div className="bg-paperCard rounded-3xl p-12 shadow-salon border border-line text-center animate-fade-in flex flex-col items-center justify-center min-h-[380px]">
            <div className="w-10 h-10 border-2 border-line border-t-amberAccent rounded-full animate-spin mb-6"></div>
            <h3 className="font-serif text-lg text-ink font-normal mb-2">正在為你調取專屬處方...</h3>
            <p className="text-xs text-subtle font-light">沉澱呼吸，氣味即將顯影</p>
          </div>
        );
      }

      return (
        <section key={currentQ} className="bg-paperCard rounded-3xl p-7 md:p-9 shadow-salon border border-line animate-fade-in relative">
          <div className="mb-6">
            <div className="flex justify-between items-center text-xs text-subtle mb-2.5">
              <span className="font-medium tracking-wider text-amberAccent">
                問題 0{currentQ + 1} / 03
              </span>
              <button 
                onClick={onBackHome} 
                className="text-[11px] text-muted hover:text-ink underline transition font-light cursor-pointer"
              >
                結束返回
              </button>
            </div>
            <div className="w-full bg-sand h-1.5 rounded-full overflow-hidden">
              <div 
                className="bg-amberAccent h-full transition-all duration-300 ease-out rounded-full" 
                style={{ width: `${((currentQ + 1) / 3) * 100}%` }}
              ></div>
            </div>
          </div>

          <h3 className="font-serif text-xl md:text-2xl text-ink font-normal mb-1.5 leading-snug">
            {q.question}
          </h3>
          <p className="text-xs text-subtle font-light mb-6">
            {q.subtitle}
          </p>

          <div className="space-y-3">
            {q.options.map((opt, idx) => {
              const isSelected = selectedIndex === idx;
              return (
                <div
                  key={idx}
                  onClick={() => handleSelectOption(idx, opt.targetId)}
                  className={`p-4 rounded-2xl border text-left cursor-pointer transition-all duration-200 flex items-center justify-between ${
                    isSelected
                      ? 'border-amberAccent bg-amberLight shadow-sm scale-[1.01]'
                      : 'border-line bg-paper/50 hover:bg-paper hover:border-muted/50'
                  }`}
                >
                  <span className={`text-xs md:text-sm leading-relaxed ${isSelected ? 'text-ink font-medium' : 'text-ink/90'}`}>
                    {opt.text}
                  </span>
                  <div className={`w-5 h-5 rounded-full flex items-center justify-center border text-xs ml-3 shrink-0 ${
                    isSelected ? 'border-amberAccent bg-amberAccent text-white' : 'border-line bg-white'
                  }`}>
                    {isSelected ? '✓' : ''}
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // ==========================================
    // 6. 模組 3：靈感抽卡 (Card Draw Funnel)
    // ==========================================
    function CardDrawView({ onCardSelected, onBackHome }) {
      const [shuffledCards, setShuffledCards] = useState([]);
      const [flippedIndex, setFlippedIndex] = useState(null);

      // 載入時使用 Math.random() 隨機洗牌 (Fisher-Yates)
      useEffect(() => {
        const arr = [...PRESCRIPTIONS];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        setShuffledCards(arr);
      }, []);

      const handleCardClick = (index, cardId) => {
        if (flippedIndex !== null) return;
        setFlippedIndex(index);

        // 翻牌完成後回傳 ID 渲染結果
        setTimeout(() => {
          onCardSelected(cardId);
        }, 650);
      };

      return (
        <section className="animate-fade-in text-center">
          <div className="flex justify-between items-center mb-6 px-1">
            <span className="text-xs text-amberAccent font-medium tracking-widest uppercase">
              Intuitive Drawing
            </span>
            <button 
              onClick={onBackHome} 
              className="text-xs text-subtle hover:text-ink underline font-light cursor-pointer"
            >
              返回主頁
            </button>
          </div>

          <div className="mb-8">
            <h2 className="font-serif text-xl md:text-2xl text-ink font-normal leading-snug">
              深呼吸三次。
            </h2>
            <p className="text-xs md:text-sm text-subtle font-light mt-1.5 tracking-wide">
              憑直覺，點擊最吸引你的那張牌。
            </p>
          </div>

          {/* 5 張牌容器 (點擊後翻牌並隱藏其他 4 張) */}
          <div className="flex justify-center items-center gap-2.5 sm:gap-4 overflow-x-auto py-4 px-1 min-h-[220px]">
            {shuffledCards.map((card, idx) => {
              const isChosen = flippedIndex === idx;
              const isOther = flippedIndex !== null && !isChosen;

              if (isOther) {
                return (
                  <div 
                    key={card.id} 
                    className="w-16 sm:w-24 aspect-[2/3] opacity-0 scale-90 transition-all duration-500 pointer-events-none hidden"
                  />
                );
              }

              return (
                <div
                  key={card.id}
                  onClick={() => handleCardClick(idx, card.id)}
                  className={`perspective-1000 cursor-pointer select-none transition-all duration-700 ease-out ${
                    isChosen 
                      ? 'w-32 sm:w-44 md:w-48 mx-auto -translate-y-2' 
                      : 'w-16 sm:w-24 md:w-28 hover:-translate-y-2'
                  }`}
                >
                  <div className={`relative w-full aspect-[2/3] rounded-2xl shadow-salon transform-style-3d transition-transform duration-700 ${
                    isChosen ? 'rotate-y-180' : ''
                  }`}>
                    {/* 卡背 (預設朝上) */}
                    <div className="absolute inset-0 w-full h-full rounded-2xl border border-line bg-sand flex flex-col items-center justify-center p-2 text-center backface-hidden overflow-hidden">
                      <div className="w-full h-full border border-line/60 rounded-xl flex flex-col items-center justify-center bg-paperCard/50">
                        <span className="w-1.5 h-1.5 rounded-full bg-amberAccent mb-1"></span>
                        <span className="font-cormorant text-[9px] tracking-widest uppercase text-subtle">SCENT</span>
                      </div>
                    </div>

                    {/* 卡面 (正面，翻轉後呈現) */}
                    <div className="absolute inset-0 w-full h-full rounded-2xl border border-amberAccent/40 bg-paperCard flex flex-col items-center justify-between p-2.5 shadow-float backface-hidden rotate-y-180 overflow-hidden">
                      <div className="w-full flex-1 rounded-xl bg-sand/60 flex items-center justify-center text-[11px] text-subtle font-serif border border-line/40 overflow-hidden">
                        <img 
                          src={card.image} 
                          alt={card.name} 
                          onError={(e) => {
                            e.currentTarget.style.display = 'none';
                            e.currentTarget.parentElement.innerText = card.name.split('｜')[0];
                          }}
                          className="w-full h-full object-cover"
                        />
                      </div>
                      <span className="text-[10px] font-serif text-ink tracking-tight mt-1.5 truncate w-full text-center">
                        {card.name.split('｜')[0]}
                      </span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    // ==========================================
    // 7. 模組 4：共用資料與結果展示組件 (Shared Result Component)
    // ==========================================
    function ResultView({ resultId, onReset }) {
      const data = PRESCRIPTIONS.find(item => item.id === resultId) || PRESCRIPTIONS[0];

      return (
        <section className="bg-paperCard rounded-3xl p-7 md:p-9 shadow-float border border-line animate-fade-in relative overflow-hidden">
          {/* 頂部標籤 */}
          <div className="flex justify-between items-start border-b border-line pb-4 mb-6">
            <div>
              <span className="font-cormorant text-xs tracking-[0.3em] uppercase text-amberAccent font-semibold block mb-1">
                Your Soul Prescription
              </span>
              <h3 className="font-serif text-xl md:text-2xl text-ink font-normal">
                {data.name}
              </h3>
            </div>
            <span className="px-3 py-1 bg-sand text-amberAccent text-[11px] font-medium rounded-full border border-line/60">
              專屬處方
            </span>
          </div>

          {/* 卡牌圖片展示 (預留 placeholder 與降級保護) */}
          <div className="w-full aspect-[16/9] sm:aspect-[21/9] rounded-2xl bg-sand/60 border border-line/80 overflow-hidden mb-6 flex items-center justify-center text-xs text-subtle font-serif">
            <img 
              src={data.image} 
              alt={data.name} 
              onError={(e) => {
                e.currentTarget.style.display = 'none';
                e.currentTarget.parentElement.innerText = `[ ${data.name} 視覺意象卡 ]`;
              }}
              className="w-full h-full object-cover"
            />
          </div>

          {/* 香調與描述 */}
          <div className="space-y-4 mb-6 text-xs leading-relaxed">
            <div className="bg-sand/40 border border-line/80 rounded-2xl p-4">
              <span className="text-subtle block text-[11px] font-light mb-1">專屬調配香調</span>
              <strong className="text-ink font-medium text-sm">{data.scent}</strong>
            </div>

            <div className="bg-paper p-4 rounded-2xl border border-line/60">
              <span className="text-subtle block text-[11px] font-light mb-1">感官處方註解</span>
              <p className="text-muted font-light text-xs">{data.description}</p>
            </div>

            <blockquote className="border-l-2 border-amberAccent pl-4 py-1 italic text-ink/90 font-serif text-sm">
              {data.quote}
            </blockquote>
          </div>

          {/* CTA 結帳按鈕 (直跳外部 Stripe Payment Link) */}
          <div className="space-y-2 pt-2">
            <a
              href={data.stripeUrl}
              target="_blank"
              rel="noopener noreferrer"
              className="w-full py-4 bg-ink text-paper text-xs tracking-[0.25em] font-medium rounded-2xl hover:bg-ink/90 active:scale-[0.99] transition shadow-md flex items-center justify-center gap-2 cursor-pointer"
            >
              <span>訂製我的專屬處方 (HKD $188)</span>
              <svg className="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>

            <p className="text-[11px] text-subtle text-center font-light pt-1">
              * 結帳時可自選順豐到付或預付
            </p>

            <button
              onClick={onReset}
              type="button"
              className="w-full py-2.5 text-xs text-subtle hover:text-ink font-light underline transition cursor-pointer text-center mt-2"
            >
              重新對話與探索
            </button>
          </div>

          <p className="text-[10px] text-subtle text-center mt-4 font-light">
            * 本處方為獨立調香沙龍按單調配，安全親膚稀釋，3–5 個工作天內寄出。
          </p>
        </section>
      );
    }

    // ==========================================
    // 8. 系統主控制器 (App Routing)
    // ==========================================
    function App() {
      // 路由狀態: 'home' | 'quiz' | 'draw' | 'result'
      const [view, setView] = useState('home');
      const [activeResultId, setActiveResultId] = useState(null);

      const handleStartQuiz = () => setView('quiz');
      const handleStartDraw = () => setView('draw');

      const handleCompleteQuiz = (finalId) => {
        setActiveResultId(finalId);
        setView('result');
      };

      const handleCardSelected = (cardId) => {
        setActiveResultId(cardId);
        setView('result');
      };

      const handleReset = () => {
        setActiveResultId(null);
        setView('home');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-xl mx-auto px-5 py-8 md:py-12">
          <Header onReset={handleReset} />

          <main className="flex-1 flex flex-col justify-center">
            {view === 'home' && (
              <HomeView 
                onStartQuiz={handleStartQuiz} 
                onStartDraw={handleStartDraw} 
              />
            )}

            {view === 'quiz' && (
              <QuizView 
                onCompleteQuiz={handleCompleteQuiz} 
                onBackHome={handleReset} 
              />
            )}

            {view === 'draw' && (
              <CardDrawView 
                onCardSelected={handleCardSelected} 
                onBackHome={handleReset} 
              />
            )}

            {view === 'result' && (
              <ResultView 
                resultId={activeResultId} 
                onReset={handleReset} 
              />
            )}
          </main>

          <footer className="mt-14 pt-6 border-t border-line text-center text-[10px] text-subtle/70 font-mono tracking-wider">
            © 2026 SCENT MIRAGE APOTHECARY. All Rights Reserved.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
