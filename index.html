<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCENT MIRAGE × AromaMood ｜ 獨立調香沙龍與日常感官探索</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F7F4EE',
            sand: '#EFE9DE',
            ink: '#2B2623',
            muted: '#766D64',
            line: '#DDD5C7',
            amberAccent: '#9E6D38',
            softClay: '#A46E5E',
            olive: '#727B66'
          },
          fontFamily: {
            serifTc: ['"Noto Serif TC"', 'serif'],
            cormorant: ['"Cormorant Garamond"', 'serif'],
            sansTc: ['"Noto Sans TC"', 'sans-serif']
          },
          boxShadow: {
            'wabi': '0 10px 30px -10px rgba(43, 38, 35, 0.05), 0 1px 3px rgba(43, 38, 35, 0.03)',
            'float': '0 20px 40px -15px rgba(43, 38, 35, 0.08), 0 0 1px rgba(43, 38, 35, 0.1)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F7F4EE;
      color: #2B2623;
      font-family: 'Noto Sans TC', sans-serif;
      background-image: radial-gradient(#E8E1D2 0.75px, transparent 0.75px);
      background-size: 24px 24px;
    }
    .wabi-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(221, 213, 199, 0.85);
    }
    .active-option {
      background: rgba(239, 233, 222, 0.65);
      border-color: #9E6D38 !important;
      box-shadow: 0 0 0 1px #9E6D38 inset;
    }
  </style>
</head>
<body class="selection:bg-amberAccent/20 selection:text-ink antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const CONFIG = {
      GUMROAD_JOURNAL_URL: "https://gumroad.com", 
      OFFICIAL_EMAIL: "contact@scentmirage.com",
      INSTAGRAM_HANDLE: "@SCENTMIRAGE.LAB"
    };

    const QUIZ_QUESTIONS = [
      {
        id: 1,
        title: "生活節奏自述",
        subtitle: "回想今天一整天的狀態，你此刻最真實的節奏是？",
        options: [
          { label: "待辦繁多，思緒難以停歇", tag: "切換段落" },
          { label: "剛結束密集社交，想沉澱安靜", tag: "感官留白" },
          { label: "正在多重角色與任務間頻繁轉換", tag: "邊界梳理" },
          { label: "節奏平緩，只想為日常留一點純粹空白", tag: "感官覺察" }
        ]
      },
      {
        id: 2,
        title: "香氣畫面聯想",
        subtitle: "如果有一種氣味能代表你此刻渴望的空間感：",
        options: [
          { label: "乾燥的老木工作台與翻開的紙張墨香", family: "木質調 Woody" },
          { label: "清晨帶露水的草葉茶與舒展的微風", family: "草本調 Herbal" },
          { label: "灑滿溫暖陽光的窗台與清脆果皮", family: "柑橘調 Citrus" },
          { label: "微風吹過開闊田野的乾燥草香與泥土", family: "大地清新 Earthy" }
        ]
      },
      {
        id: 3,
        title: "氣味調性偏好",
        subtitle: "在香氣質地上，你直覺更受哪種觸感吸引？",
        options: [
          { label: "沉穩、包覆感強的厚實溫暖", tone: "深層沉靜" },
          { label: "通透、帶有空氣流通感的明亮清新", tone: "通透開闊" },
          { label: "微苦、不甜膩的植物原生氣息", tone: "回甘質樸" },
          { label: "溫和、像曬乾棉麻布料般的潔淨感", tone: "柔潤親膚" }
        ]
      },
      {
        id: 4,
        title: "日常轉場時段",
        subtitle: "你最想為一天中的哪一個時光，安放一個 3 分鐘小儀式？",
        options: [
          { label: "晨間出門前，為新的一天設定安定的錨點", time: "晨間開啟" },
          { label: "工作結束時，合上電腦標記任務的段落", time: "公私界線" },
          { label: "傍晚歸家後，洗淨喧囂與切換生活角色", time: "夜間收整" },
          { label: "睡前熄燈前，讓大腦正式卸下所有重擔", time: "深夜留白" }
        ]
      }
    ];

    function App() {
      const [step, setStep] = useState(0); 
      const [answers, setAnswers] = useState({});
      const [modalContent, setModalContent] = useState(null);
      const [copied, setCopied] = useState(false);

      const handleSelectOption = (qIndex, option) => {
        setAnswers(prev => ({ ...prev, [qIndex]: option }));
      };

      const handleNext = () => {
        if (step < QUIZ_QUESTIONS.length) {
          setStep(step + 1);
        }
      };

      const handlePrev = () => {
        if (step > 1) {
          setStep(step - 1);
        } else if (step === 1) {
          setStep(0);
        }
      };

      const handleRestart = () => {
        setAnswers({});
        setStep(0);
        setCopied(false);
      };

      const copyResult = () => {
        const text = `【SCENT MIRAGE 香氣靈感卡】\n生活節奏：${answers[0]?.tag || "日常覺察"}\n偏好香調：${answers[1]?.family || "木質草本"}\n質感偏好：${answers[2]?.tone || "沉靜留白"}\n轉場時刻：${answers[3]?.time || "日常時段"}\n（本卡僅供個人感官探索，無醫療療效）`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-xl mx-auto px-6 py-10 md:py-14">
          {/* Header */}
          <header className="text-center mb-10">
            <div className="inline-block tracking-[0.35em] text-[11px] uppercase text-muted font-medium mb-1">
              Apothecary Atelier
            </div>
            <h1 className="font-cormorant text-3xl md:text-4xl tracking-[0.22em] font-medium uppercase text-ink">
              SCENT MIRAGE
            </h1>
            <div className="w-8 h-[1px] bg-line mx-auto my-3"></div>
            <p className="font-serifTc text-xs tracking-widest text-muted font-light">
              獨立調香沙龍 ｜ 日常感官留白
            </p>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col justify-center">
            {step === 0 && (
              <div className="wabi-card rounded-3xl p-8 md:p-10 shadow-wabi text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-amberAccent/40 to-transparent"></div>
                
                <span className="inline-block px-3.5 py-1 bg-sand/70 text-amberAccent text-[11px] tracking-widest font-medium rounded-full mb-6 border border-line/60">
                  1-MINUTE SENSORY RITUAL
                </span>
                
                <h2 className="font-serifTc text-2xl md:text-3xl font-normal leading-snug text-ink mb-4">
                  用 1 分鐘探索<br className="hidden sm:inline" />此刻偏好的香氣氛圍
                </h2>
                
                <p className="text-xs md:text-sm leading-relaxed text-muted font-light max-w-md mx-auto mb-8">
                  氣味不是重整狀態的靈丹妙藥，而是一枚溫和的感官提示——就像在翻閱下一頁之前輕放的書籤。回答 4 個生活直覺問題，整理專屬於你的留白靈感卡。
                </p>

                <button
                  onClick={() => setStep(1)}
                  className="w-full py-4 bg-ink text-paper text-xs tracking-[0.25em] font-medium rounded-2xl hover:bg-ink/90 transition shadow-sm active:scale-[0.99]"
                >
                  開始香氣探索
                </button>

                <p className="text-[11px] text-muted/70 mt-5 leading-normal font-light">
                  * 僅供個人感官生活記錄，不具醫療診斷或心理治療承諾。
                </p>
              </div>
            )}

            {step >= 1 && step <= QUIZ_QUESTIONS.length && (
              <div className="wabi-card rounded-3xl p-7 md:p-9 shadow-wabi relative">
                {/* Progress bar */}
                <div className="mb-7">
                  <div className="flex justify-between items-center text-xs text-muted mb-2 font-light">
                    <span className="tracking-widest">步驟 {step} / {QUIZ_QUESTIONS.length}</span>
                    <button onClick={handlePrev} className="underline hover:text-ink transition text-[11px]">返回上一題</button>
                  </div>
                  <div className="w-full bg-sand/80 h-[2px] rounded-full overflow-hidden">
                    <div 
                      className="bg-amberAccent h-full transition-all duration-300 ease-out" 
                      style={{ width: `${(step / QUIZ_QUESTIONS.length) * 100}%` }}
                    ></div>
                  </div>
                </div>

                <h3 className="font-serifTc text-xl md:text-2xl font-normal text-ink mb-2">
                  {QUIZ_QUESTIONS[step - 1].title}
                </h3>
                <p className="text-xs text-muted font-light leading-relaxed mb-6">
                  {QUIZ_QUESTIONS[step - 1].subtitle}
                </p>

                <div className="space-y-3 mb-8">
                  {QUIZ_QUESTIONS[step - 1].options.map((opt, idx) => {
                    const isSelected = answers[step - 1]?.label === opt.label;
                    return (
                      <div
                        key={idx}
                        onClick={() => handleSelectOption(step - 1, opt)}
                        className={`p-4 rounded-2xl border text-xs md:text-sm cursor-pointer transition-all duration-200 flex items-center justify-between ${
                          isSelected
                            ? "active-option text-ink font-medium"
                            : "border-line/70 bg-white/50 hover:bg-white/80 hover:border-muted/50 text-[#554E48]"
                        }`}
                      >
                        <span className="leading-relaxed">{opt.label}</span>
                        {isSelected && <span className="text-amberAccent text-xs ml-3">✦</span>}
                      </div>
                    );
                  })}
                </div>

                <button
                  disabled={!answers[step - 1]}
                  onClick={handleNext}
                  className={`w-full py-3.5 text-xs tracking-[0.2em] font-medium rounded-2xl transition duration-200 ${
                    answers[step - 1]
                      ? "bg-ink text-paper hover:bg-ink/90 active:scale-[0.99]"
                      : "bg-line/60 text-muted/60 cursor-not-allowed"
                  }`}
                >
                  {step === QUIZ_QUESTIONS.length ? "查看專屬香氣靈感卡" : "下一題"}
                </button>
              </div>
            )}

            {step > QUIZ_QUESTIONS.length && (
              <div className="space-y-8 animate-fade-in">
                {/* 靈感卡 */}
                <div className="wabi-card rounded-3xl p-7 md:p-9 shadow-float border-amberAccent/30 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-amberAccent/5 rounded-full blur-2xl pointer-events-none"></div>

                  <div className="border-b border-line pb-4 mb-5">
                    <span className="font-cormorant text-xs tracking-[0.3em] text-amberAccent uppercase font-medium">
                      Scent Inspiration Card
                    </span>
                    <h3 className="font-serifTc text-2xl font-normal text-ink mt-1.5">
                      {answers[3]?.time || "日常"}・{answers[1]?.family?.split(" ")[0] || "沉靜"}靈感
                    </h3>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-xs mb-6">
                    <div className="bg-white/60 p-4 rounded-2xl border border-line/60">
                      <span className="text-muted block text-[11px] mb-1 font-light">感官畫面聯想</span>
                      <strong className="text-ink font-medium">{answers[1]?.family || "木質調"}</strong>
                    </div>
                    <div className="bg-white/60 p-4 rounded-2xl border border-line/60">
                      <span className="text-muted block text-[11px] mb-1 font-light">觸感偏好</span>
                      <strong className="text-ink font-medium">{answers[2]?.tone || "通透開闊"}</strong>
                    </div>
                  </div>

                  <div className="text-xs text-muted leading-relaxed border-t border-line/60 pt-4 font-light">
                    前調：清新果皮微風 ｜ 中調：乾燥紙張與草葉 ｜ 後調：溫和原木質地<br />
                    <span className="text-[10px] text-muted/70 mt-1.5 block">
                      * 上述香調為感官意象聯想，非直接皮膚塗抹處方。
                    </span>
                  </div>

                  <div className="flex gap-3 mt-6 pt-2">
                    <button
                      onClick={copyResult}
                      className="flex-1 py-2.5 text-xs tracking-wider border border-ink/80 text-ink rounded-xl hover:bg-white transition"
                    >
                      {copied ? "已複製到剪貼簿 ✓" : "複製此靈感卡"}
                    </button>
                    <button
                      onClick={handleRestart}
                      className="px-4 py-2.5 text-xs text-muted hover:text-ink underline transition font-light"
                    >
                      重新測驗
                    </button>
                  </div>
                </div>

                {/* 3 大核准商品入口 */}
                <div className="space-y-4 pt-2">
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-amberAccent text-xs">✦</span>
                    <h4 className="font-serifTc text-sm font-medium tracking-wider text-ink">
                      將感官練習延續至日常生活
                    </h4>
                  </div>

                  {/* 商品 1: 手札 */}
                  <div className="wabi-card p-6 rounded-2xl shadow-wabi flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] tracking-wider uppercase bg-sand/70 border border-line px-2.5 py-0.5 rounded-full text-muted font-medium">
                        即時數位下載
                      </span>
                      <h5 className="font-serifTc text-base font-medium text-ink mt-2">《7 日香氣轉場手札》數位版</h5>
                      <p className="text-xs text-muted mt-1 font-light">含 12 頁手札 PDF + 真正 A6 尺寸隨身卡</p>
                      <div className="text-sm font-semibold text-amberAccent mt-2">HK$78</div>
                    </div>
                    <a
                      href={CONFIG.GUMROAD_JOURNAL_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-center px-5 py-2.5 bg-ink text-paper text-xs tracking-widest rounded-xl hover:bg-ink/90 transition shadow-sm"
                    >
                      立即購買
                    </a>
                  </div>

                  {/* 商品 2: 滾珠油 */}
                  <div className="wabi-card p-6 rounded-2xl shadow-wabi flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] tracking-wider uppercase bg-sand/70 border border-line px-2.5 py-0.5 rounded-full text-muted font-medium">
                        接單製作 3-5 天
                      </span>
                      <h5 className="font-serifTc text-base font-medium text-ink mt-2">5ml 客製香氣滾珠油</h5>
                      <p className="text-xs text-muted mt-1 font-light">以琥珀色鋼珠瓶調製，運費另計</p>
                      <div className="text-sm font-semibold text-amberAccent mt-2">HK$98</div>
                    </div>
                    <button
                      onClick={() => setModalContent({
                        title: "5ml 客製香氣滾珠油 (HK$98)",
                        desc: "本產品為按單調配，確認原料包材現貨後於 3-5 個工作天內調製完成寄出。目前第一批樣品測試中，歡迎聯繫我們登記候補名額。"
                      })}
                      className="px-5 py-2.5 border border-line text-ink text-xs tracking-wider rounded-xl hover:bg-white hover:border-ink transition"
                    >
                      查詢預約
                    </button>
                  </div>

                  {/* 商品 3: 工作坊 */}
                  <div className="wabi-card p-6 rounded-2xl shadow-wabi flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] tracking-wider uppercase bg-sand/70 border border-line px-2.5 py-0.5 rounded-full text-muted font-medium">
                        實體創作體驗
                      </span>
                      <h5 className="font-serifTc text-base font-medium text-ink mt-2">「心靈鏡像」調香工作坊</h5>
                      <p className="text-xs text-muted mt-1 font-light">90 分鐘獨立沙龍手作 ｜ 非心理治療</p>
                      <div className="text-sm font-semibold text-amberAccent mt-2">HK$380</div>
                    </div>
                    <button
                      onClick={() => setModalContent({
                        title: "心靈鏡像工作坊 (90分鐘 / HK$380)",
                        desc: "以香氣與個人聯想為素材的創作型感官手作體驗，非醫療或心理諮商服務。如欲預約場次與確認人數名額，請點擊聯繫。"
                      })}
                      className="px-5 py-2.5 border border-line text-ink text-xs tracking-wider rounded-xl hover:bg-white hover:border-ink transition"
                    >
                      查詢場次
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Modal */}
          {modalContent && (
            <div className="fixed inset-0 bg-ink/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="wabi-card rounded-3xl p-7 max-w-sm w-full shadow-float border-line">
                <h4 className="font-serifTc text-lg font-medium text-ink mb-2">{modalContent.title}</h4>
                <p className="text-xs text-muted leading-relaxed mb-6 font-light">{modalContent.desc}</p>
                <div className="flex gap-2">
                  <a
                    href={`mailto:${CONFIG.OFFICIAL_EMAIL}?subject=查詢：${encodeURIComponent(modalContent.title)}`}
                    className="flex-1 text-center py-2.5 bg-ink text-paper text-xs tracking-wider rounded-xl hover:bg-ink/90 transition"
                  >
                    發送電郵查詢
                  </a>
                  <button
                    onClick={() => setModalContent(null)}
                    className="px-4 py-2.5 border border-line text-xs text-muted rounded-xl hover:bg-white transition"
                  >
                    關閉
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer & Compliance */}
          <footer className="mt-14 pt-8 border-t border-line/70 text-center text-[11px] text-muted leading-relaxed space-y-4 font-light">
            <p className="max-w-md mx-auto">
              <strong className="font-medium text-ink">安全須知 Safety Notice：</strong><br />
              本內容只供個人感官探索與生活記錄，不提供醫療診斷、心理治療或個人化健康建議，亦不保證任何生理或情緒效果。完成測驗或手札不需要使用精油。若使用香氛產品，請遵照產品標示並保持空氣流通；勿口服精油，亦勿將未稀釋精油塗抹於皮膚。
            </p>
            <p className="text-[10px] text-muted/60 font-mono tracking-wider">
              © 2026 SCENT MIRAGE APOTHECARY. All Rights Reserved.
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
